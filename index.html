<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2233;--mute:#667089;--line:#e3e6f0;--brand:#4f46e5;--brand2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--shadow:0 6px 24px rgba(30,40,90,.08);--r:16px}

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}

header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.nl{color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;white-space:nowrap}.nl:hover{background:var(--card);color:var(--ink)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}
.btn.sm{padding:5px 10px;font-size:13px}
.hero{padding:44px 0 20px}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);max-width:660px;font-size:17px;margin:0 0 20px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat b{font-size:26px;display:block}.stat small{color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .5s}
h2.sec{font-size:24px;margin:40px 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;transition:.15s;position:relative;text-align:left}
.tc:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand)}
.tc .t{font-weight:700;font-size:17px}.tc .k{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tc .pct{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.tc .ic{font-size:30px}.tc p{margin:0;color:var(--mute);font-size:14px}
input[type=search],select,.fld{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.alert{background:var(--card);border:1px dashed var(--warn);border-radius:var(--r);padding:14px 16px;margin-top:14px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--brand) 10%,var(--card))}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
footer{margin-top:60px;border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:14px}
#view{display:none;padding:26px 0 60px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0;overflow:auto}
.tab{border:0;background:none;color:var(--mute);padding:10px 16px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.notes h3{margin:22px 0 6px}.notes h3:first-child{margin-top:0}
.notes .ex{background:color-mix(in srgb,var(--brand) 8%,var(--card));border-left:4px solid var(--brand);padding:10px 14px;border-radius:8px;margin:10px 0}
.notes .warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;margin:10px 0}
.notes mark{background:#fde68a;color:#1c2233;border-radius:4px;padding:0 3px}
.q{margin-bottom:18px}.q .qt{font-weight:700;margin-bottom:10px;font-size:18px}
.ctx{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-style:italic}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;margin-bottom:7px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.exp{font-size:14px;color:var(--mute);margin-top:4px;display:none}
.prog{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px}
.score{font-size:42px;font-weight:800;text-align:center;margin:10px 0}
.timer{font-weight:800;font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.rev{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rev small{color:var(--mute);display:block}
textarea{width:100%;min-height:170px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{margin-top:6px;width:17px;height:17px}
.model{background:color-mix(in srgb,var(--ok) 8%,var(--card));border-left:4px solid var(--ok);border-radius:8px;padding:12px 16px;margin-top:12px;display:none;white-space:pre-wrap}
/* pathways */
.steps{list-style:none;padding:0;margin:0}
.step{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;position:relative}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--line);color:var(--mute)}
.step.done .dot{background:var(--ok);color:#fff}.step.cur{border-color:var(--brand);box-shadow:var(--shadow)}.step.cur .dot{background:var(--brand);color:#fff}
.step .sp{flex:1}.step b{display:block}.step small{color:var(--mute)}
.week{margin-bottom:18px}.week h3{margin:0 0 8px}
.task{display:flex;gap:10px;padding:6px 0;align-items:flex-start}.task input{margin-top:7px;width:17px;height:17px}
/* flashcards */
.fc{perspective:900px;max-width:520px;margin:18px auto;height:260px;cursor:pointer}
.fc>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip>div{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc .f{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:28px;font-weight:800}
.fc .b{background:var(--card);transform:rotateY(180deg);font-size:17px}
.fc .b i{color:var(--mute);margin-top:10px}
.gl dt{font-weight:800;margin-top:14px}.gl dd{margin:2px 0 0;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
#toast.on{opacity:1}

.who{font-size:13px;font-weight:700;background:color-mix(in srgb,var(--brand) 12%,var(--card));border:1px solid var(--line);border-radius:99px;padding:4px 12px;white-space:nowrap}
.sync{font-size:12px;color:var(--mute);white-space:nowrap;margin:0 6px}.sync.error{color:var(--bad)}
.late{color:var(--bad);font-weight:600}.msg{min-height:22px;margin-top:8px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.col label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}.col label.inl{flex-direction:row;align-items:flex-start;gap:8px;font-weight:400}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.fld{font:inherit}textarea.fld{width:100%;min-height:90px}
.code{font-size:26px;letter-spacing:.25em;text-transform:uppercase;font-weight:800;width:240px;text-align:center}
.authbox{max-width:480px;margin:20px auto}
button.tc{font:inherit;cursor:pointer}
.doneCard{border-color:var(--ok)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.codebox{text-align:right}.codebox small{display:block;color:var(--mute)}
.bigcode{font-size:30px;letter-spacing:.18em;font-weight:800;color:var(--brand);margin-right:8px}
.codechip{font-weight:800;letter-spacing:.12em;background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand);border-radius:8px;padding:1px 8px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table.dt td,table.dt th{white-space:nowrap}table.dt .bar{min-width:90px;margin-top:4px}
th.srt{cursor:pointer;user-select:none}
.badge{display:inline-block;border-radius:6px;padding:0 8px;font-weight:700;font-size:13px}
.hc0{background:var(--line);color:var(--mute)}.hc1{background:#fecaca;color:#7f1d1d}.hc2{background:#fde68a;color:#78350f}.hc3{background:#bbf7d0;color:#14532d}
table.heat{font-size:12px}table.heat td,table.heat th{padding:4px 6px;text-align:center;min-width:34px}
table.heat .stk{position:sticky;left:0;background:var(--card);text-align:left;white-space:nowrap;min-width:130px;z-index:1}
table.heat th.rot{height:150px;vertical-align:bottom}table.heat th.rot span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600}
ul.clean,ol.clean{padding-left:18px;margin:0}ul.clean li,ol.clean li{margin-bottom:8px}ul.clean small,ol.clean small{color:var(--mute)}
.pinchip{font-weight:800;letter-spacing:.2em;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 8px}.pin{width:110px;text-align:center;letter-spacing:.3em;font-weight:800}.notice{background:color-mix(in srgb,var(--brand) 8%,var(--card));border-left:4px solid var(--brand);border-radius:8px;padding:8px 12px;font-size:14px}
.dangerb{border-color:var(--bad);color:var(--bad)}
@media print{header.top,footer,.btn,.cta,.chips,#toast,input,select{display:none!important}body{background:#fff;color:#000}.panel,.info{box-shadow:none}}
</style>
</head>

<script id="data">
/* ================= DATA ================= */
const G="grammar",W="writing",R="reading";
const WDEF=["I knew my purpose and audience","My opening grabs attention","I used paragraphs for separate ideas","I varied my vocabulary and sentence lengths","I checked spelling, capital letters and punctuation","My ending is strong"];
const GDEF=["I used the target grammar at least 5 times","Every sentence starts with a capital letter and ends with correct punctuation","I read it aloud and it sounds right"];
const RDEF=["I used my own words","I kept to the main points","I checked my answer against the text"];

const T=[
/* ---------- GRAMMAR ---------- */
{id:"nouns",n:"Nouns",k:G,notes:`<h3>Types of noun</h3><ul><li><b>Common</b>: city, teacher</li><li><b>Proper</b> (capital letter): Hanoi, Ms Lee</li><li><b>Abstract</b> (can't touch): courage, joy</li><li><b>Collective</b>: a flock of birds, a team</li><li><b>Concrete</b>: bridge, apple</li></ul><h3>Plurals</h3><p>Add <b>-s</b> (cat → cats); <b>-es</b> after s, x, ch, sh (box → boxes); consonant + y → <b>-ies</b> (baby → babies); f/fe → <b>-ves</b> (knife → knives). Irregular: child → children, mouse → mice, sheep → sheep.</p><h3>Possession</h3><p>One owner: <i>the girl<mark>'s</mark> bag</i>. Plural ending in s: <i>the girls<mark>'</mark> bags</i>. Irregular plural: <i>the children<mark>'s</mark> toys</i>.</p>`,
 q:[["Which is an abstract noun?","happiness",["table","Paris","dog"],"You cannot touch happiness."],["Plural of 'baby':","babies",["babys","babyes","babi"],"Consonant + y → -ies."],["A 'swarm of bees' – 'swarm' is a…","collective noun",["proper noun","verb","adjective"],"It names a group."],["Which needs a capital letter?","Vietnam",["river","country","mountain"],"Vietnam is a proper noun (a specific name)."],["Plural of 'child':","children",["childs","childen","childes"],"Irregular plural."],["A group of wolves is called a…","pack",["herd","flock","swarm"],"A pack of wolves."],["Plural of 'box':","boxes",["boxs","boxen","boxies"],"Add -es after x."],["Plural of 'knife':","knives",["knifes","knifs","knifies"],"f/fe changes to -ves."],["Which is a countable noun?","apple",["water","sand","rice"],"You can count apples: one apple, two apples."],["The toys of the children →","the children's toys",["the childrens' toys","the childrens toys","the children toys'"],"Irregular plural 'children' takes 's."],["Which noun is concrete?","bridge",["freedom","kindness","bravery"],"You can see and touch a bridge."],["Plural of 'sheep':","sheep",["sheeps","sheepes","sheepen"],"Sheep is the same in singular and plural."]],
 w:["Write 6 sentences about your school. Use at least one proper noun, one abstract noun and one collective noun.","Write the plural of ten different nouns, then use five of them in sentences."]},
{id:"pronouns",n:"Pronouns",k:G,notes:`<h3>Replacing nouns</h3><p>Pronouns stand in for nouns so we don't repeat them.</p><ul><li>Subject: I, you, he, she, it, we, they</li><li>Object: me, you, him, her, it, us, them</li><li>Possessive: mine, yours, his, hers, ours, theirs</li><li>Reflexive: myself, himself, themselves…</li><li>Interrogative: who, whom, whose, which, what</li></ul><div class="ex">Tom gave <mark>his</mark> book to Ana. She thanked <mark>him</mark>.</div><div class="warn"><b>its</b> = belongs to it. <b>it's</b> = it is.</div>`,
 q:[["'___ are my best friends.'","They",["Them","Their","Him"],"Subject pronoun needed."],["'Give the ball to ___.'","her",["she","hers","he"],"Object pronoun."],["The book is ___. (belongs to me)","mine",["my","me","I"],"'Mine' stands alone."],["Which word is a pronoun?","them",["quickly","happy","run"],"'Them' replaces nouns."],["'Sam and I' can be replaced by…","we",["us","them","they"],"Subject form: we."],["Replace 'The girls' in 'The girls laughed.'","They",["Them","Their","She"],"Plural subject → they."],["'He hurt ___.'","himself",["hisself","him","his"],"Reflexive pronoun."],["'Ali and ___ went home.'","I",["me","myself","mine"],"Subject of the sentence → I."],["Which is an interrogative pronoun?","Who",["She","They","Them"],"Used to ask questions."],["This house is ___. (belongs to us)","ours",["our","us","we"],"Possessive pronoun stands alone."],["In 'The dog wagged its tail', 'its' shows…","ownership",["it is","an action","time"],"No apostrophe for possession."],["Replace 'the box' in 'I opened the box.'","it",["he","they","them"],"Singular thing → it."]],
 w:["Write a short paragraph about two friends without repeating any names more than twice – use pronouns.","Write 4 sentences using mine, yours, ours and theirs."]},
{id:"verbs",n:"Verbs",k:G,notes:`<h3>Action, state &amp; helping verbs</h3><p>Verbs show <b>actions</b> (run, think), <b>states</b> (be, seem) or help other verbs (<i>is</i> running, <i>have</i> eaten). <b>Modal</b> verbs (can, could, will, would, should, must) show possibility or obligation.</p><h3>Subject–verb agreement</h3><p>Singular subject → singular verb: <i>The dog <mark>barks</mark></i>. Plural: <i>The dogs <mark>bark</mark></i>. <i>Each of the boys <mark>has</mark> a ticket.</i></p><h3>Regular vs irregular</h3><p>Regular past: add -ed (walk → walked). Irregular: go → went → gone, see → saw → seen, write → wrote → written, bring → brought.</p><p>The <b>infinitive</b> is <i>to</i> + verb: to swim.</p>`,
 q:[["Pick the verb: 'Maria painted a mural.'","painted",["Maria","a","mural"],"The action word."],["'The children ___ in the park.'","play",["plays","playing","plays'"],"'Children' is plural."],["Past tense of 'go':","went",["goed","gone","going"],"Irregular verb."],["Which is a helping verb in 'She is reading'?","is",["She","reading","None"],"'Is' helps the main verb."],["Which is a state verb?","seems",["jump","kick","throw"],"'Seem' describes a state."],["'Each of the boys ___ a ticket.'","has",["have","are having","having"],"'Each' is singular."],["Past participle of 'write':","written",["wrote","writed","writing"],"I have written."],["Which verb is irregular?","swim",["jump","walk","play"],"swim → swam → swum."],["'The dog and the cat ___ asleep.'","are",["is","was is","be"],"Two subjects → plural."],["Past tense of 'bring':","brought",["bringed","brang","brung"],"Irregular."],["The infinitive form is…","to swim",["swimming","swam","swims"],"to + base verb."],["Which is a modal verb?","could",["jump","happy","quickly"],"Modals: can, could, will, would, should, must."]],
 w:["Write 6 sentences about your weekend using action verbs only.","Write 5 sentences using the modal verbs can, could, should, must and will."]},
{id:"adjectives",n:"Adjectives",k:G,notes:`<h3>What is an adjective?</h3><p>An adjective describes a <b>noun</b> or <b>pronoun</b>: what kind, how many, which one.</p><div class="ex">a <mark>tall</mark> tree · <mark>three</mark> cats · <mark>that</mark> book · <mark>her</mark> bag</div><h3>Comparing</h3><p>Short adjectives add <b>-er / -est</b>: tall → taller → tallest (happy → happier → happiest). Long adjectives use <b>more / most</b>: more beautiful, most beautiful. Irregular: good → better → best; bad → worse → worst.</p><h3>Order of adjectives</h3><p>Opinion → size → age → colour → origin → material: <i>a lovely small old red Chinese silk scarf</i>.</p><p>A <b>proper adjective</b> comes from a proper noun: <i>Vietnamese</i> food.</p>`,
 q:[["Which word is an adjective in: 'The hungry lion roared'?","hungry",["lion","roared","The"],"It describes the noun 'lion'."],["'This book is ___ than that one.'","more interesting",["interestinger","most interesting","interesting"],"Long adjective + 'more' for two things."],["Superlative of 'good':","best",["goodest","better","most good"],"good → better → best."],["Which order is correct?","a big red ball",["a red big ball","a ball big red","a red ball big"],"Size before colour."],["Which sentence has an adjective?","They saw a huge whale.",["She ran quickly.","He sang loudly.","We walked home."],"'Huge' describes 'whale'."],["Possessive adjective in 'Her bag is red':","Her",["bag","is","red"],"'Her' shows who owns the bag."],["Which is a proper adjective?","Vietnamese",["cheerful","heavy","quiet"],"Made from the proper noun Vietnam."],["Comparative of 'happy':","happier",["happyer","happiest","happily"],"Change y → i, add -er."],["Correct sentence:","She is the tallest girl in the class.",["She is the most tall girl in the class.","She is the taller girl in the class.","She is tallest girl in class."],"Superlative with 'the' for three or more."],["'Many' in 'many students' tells us…","quantity",["place","manner","time"],"An adjective of quantity."],["Demonstrative adjective in 'Those shoes are mine':","Those",["shoes","are","mine"],"Points out which shoes."],["Comparative of 'bad':","worse",["badder","worst","more bad"],"Irregular: bad → worse → worst."]],

{id:"adverbs",n:"Adverbs",k:G,notes:`<h3>What is an adverb?</h3><p>An adverb tells us <b>how, when, where</b> or <b>how often</b>. It can modify a verb, an adjective or another adverb.</p><div class="ex">She sang <mark>beautifully</mark>. · He arrived <mark>late</mark>. · It is <mark>very</mark> cold.</div><h3>Forming adverbs</h3><p>Adjective + <b>-ly</b>: quick → quickly. happy → happ<b>ily</b>. gentle → gent<b>ly</b>. Irregular: good → <b>well</b>; fast → fast; hard → hard.</p><h3>Types</h3><ul><li>Manner: slowly, carefully</li><li>Time: yesterday, soon</li><li>Place: here, outside</li><li>Frequency: always, never, often</li><li>Degree: very, extremely, quite</li></ul>`,

{id:"prepositions",n:"Prepositions",k:G,notes:`<h3>Showing relationships</h3><p>Prepositions show <b>place</b> (in, on, under, beside), <b>time</b> (at, on, in, during, since, for) or <b>direction</b> (to, towards, across, through).</p><div class="ex">at 5 o'clock · on Monday · in July · The cat is <mark>under</mark> the table.</div><p><b>at</b> + exact time · <b>on</b> + day/date · <b>in</b> + month/year/season.</p><p><b>since</b> + starting point (since 2020) · <b>for</b> + length of time (for three years).</p><p>Common pairs: afraid <i>of</i>, good <i>at</i>, interested <i>in</i>, listen <i>to</i>. A preposition is followed by a noun or pronoun.</p>`,

{id:"conjunctions",n:"Conjunctions",k:G,notes:`<h3>Joining words</h3><p><b>Coordinating</b> (join equal parts) – <b>FANBOYS</b>: for, and, nor, but, or, yet, so.</p><p><b>Subordinating</b> (add a less important idea): because, although, when, while, if, after, before, unless, since.</p><p><b>Correlative</b> pairs: either…or, neither…nor, both…and.</p><div class="ex">I was tired <mark>but</mark> I kept going. · <mark>Although</mark> it rained, we played.</div><p>Use <b>so</b> for a result, <b>but</b> for contrast, <b>because</b> for a reason.</p>`,

{id:"articles-a-an-the",n:"Articles (a, an, the)",k:G,notes:`<h3>Three little words</h3><p><b>a</b> before a consonant <i>sound</i>: a dog, a university (sounds like “you”), a one-off.</p><p><b>an</b> before a vowel <i>sound</i>: an apple, an hour (silent h), an honest man.</p><p><b>the</b> = a specific or already mentioned thing: <i>I saw a cat. The cat was black.</i> Also unique things: the Sun, the Moon.</p><p><b>No article</b> for general plural/uncountable ideas: <i>I like music. Dogs are loyal.</i></p><p>Say <i>play <b>the</b> guitar</i> but <i>play football</i>.</p>`,

{id:"tenses",n:"Tenses",k:G,notes:`<h3>Past, present, future</h3><ul><li>Simple present: I walk (habits, facts)</li><li>Present continuous: I am walking (now)</li><li>Simple past: I walked (finished action)</li><li>Past continuous: I was walking (in progress, interrupted)</li><li>Present perfect: I have walked (past with a link to now)</li><li>Future: I will walk / I am going to walk</li></ul><p>Time clues: <i>every day</i> (present), <i>right now</i> (continuous), <i>yesterday</i> (past), <i>tomorrow</i> (future), <i>ever, never, already</i> (perfect). Keep one tense consistent unless time changes.</p>`,

{id:"sentence-types",n:"Sentence Types",k:G,notes:`<h3>By purpose</h3><ul><li><b>Statement</b>: The bus is late.</li><li><b>Question</b>: Where are you going?</li><li><b>Command</b>: Close the door.</li><li><b>Exclamation</b>: What a lovely day!</li></ul><h3>By structure</h3><ul><li><b>Simple</b>: one clause. <i>I like tea.</i></li><li><b>Compound</b>: two main clauses joined by and/but/or/so. <i>I like tea but she likes coffee.</i></li><li><b>Complex</b>: main clause + subordinate clause. <i>Although it rained, we played.</i></li></ul><p>A <b>clause</b> has a subject and a verb. A subordinate clause cannot stand alone. A <b>fragment</b> (“Because it was late.”) is not a full sentence. A <b>run-on</b> joins sentences without correct linking.</p>`,

{id:"punctuation",n:"Punctuation",k:G,notes:`<h3>The essentials</h3><ul><li><b>Full stop</b> ends a statement. <b>?</b> a question. <b>!</b> strong feeling.</li><li><b>Comma</b>: lists (<i>apples, pears and plums</i>), after openers (<i>After lunch, we played</i>), direct address (<i>Tom, sit down</i>).</li><li><b>Apostrophe</b>: contractions (don't) and possession (Tom's bag).</li><li><b>Speech marks</b>: “Come here,” said Mum.</li><li><b>Colon</b> introduces a list: <i>You need: a pen, a ruler.</i></li><li><b>Hyphen</b> joins words: a well-known author.</li><li><b>Brackets</b> add extra information.</li></ul><div class="warn"><b>its</b> = belonging to it · <b>it's</b> = it is.</div>`,

{id:"synonyms-antonyms",n:"Synonyms & Antonyms",k:G,notes:`<h3>Same and opposite</h3><p><b>Synonyms</b> have similar meanings: big – huge – enormous. <b>Antonyms</b> have opposite meanings: hot – cold.</p><h3>Shades of meaning</h3><p>Synonyms differ in strength: <i>angry → furious</i>, <i>tired → exhausted</i>, <i>said → whispered / shouted / murmured</i>. Choose the one that fits the mood.</p><p>Upgrade boring words: <i>nice → delightful</i>, <i>good → excellent</i>, <i>walk → stroll / march</i>. Use a thesaurus but check meanings in a dictionary.</p>`,

{id:"prefixes-suffixes",n:"Prefixes & Suffixes",k:G,notes:`<h3>Word parts</h3><p>A <b>prefix</b> goes at the start and changes meaning: <b>un-</b> (not): unhappy · <b>re-</b> (again): rewrite · <b>dis-</b> (opposite): disagree · <b>mis-</b> (wrongly): misspell · <b>pre-</b> (before): preview · <b>im-/in-/il-/ir-</b> (not): impossible, incorrect.</p><p>A <b>suffix</b> goes at the end and often changes word class: <b>-ful</b> (full of): careful · <b>-less</b> (without): careless · <b>-ness</b>: kindness · <b>-ment</b>: enjoyment · <b>-able</b>: comfortable · <b>-ly</b>: slowly.</p><p>Spelling changes: happy → happi<b>ness</b>; make → mak<b>ing</b>. The <b>root</b> is the main part: unbelievable → believe.</p>`,

{id:"figures-of-speech",n:"Figures of Speech",k:G,notes:`<h3>Making language vivid</h3><ul><li><b>Simile</b> – compares using like/as: <i>as brave as a lion</i></li><li><b>Metaphor</b> – says one thing <i>is</i> another: <i>time is a thief</i></li><li><b>Personification</b> – human traits for non-humans: <i>the wind whispered</i></li><li><b>Hyperbole</b> – exaggeration: <i>I've told you a million times</i></li><li><b>Alliteration</b> – repeated starting sounds: <i>sly silver snake</i></li><li><b>Onomatopoeia</b> – sound words: <i>buzz, crash</i></li><li><b>Idiom</b> – fixed phrase with hidden meaning: <i>it's raining cats and dogs</i> (raining heavily)</li></ul>`,

{id:"reading-comprehension",n:"Reading Comprehension",k:R,notes:`<h3>How to read well</h3><ul><li><b>Skim</b> first for the gist, then read carefully.</li><li><b>Scan</b> for key words when answering factual questions.</li><li><b>Infer</b>: read between the lines – what the text suggests but doesn't say.</li><li>Find <b>evidence</b>: quote or point to words that prove your answer.</li><li>Work out <b>vocabulary in context</b>: use nearby words to guess meaning.</li></ul><h3>Answering tips</h3><p>Use the question's words in your answer. Look at the marks. Check tone and purpose: to inform, persuade, entertain or describe? Fiction tells a story; non-fiction gives facts.</p>`,
 q:[["Inference means…","reading between the lines",["copying the text","skipping words","reading aloud"],"Working out what is suggested."],["Scanning is…","looking for specific words or facts",["reading every word slowly","reading the ending only","guessing"],"Fast, targeted reading."],["Skimming is used to…","get the general idea quickly",["find one date","learn spellings","copy sentences"],"Gist."],["What time of day does the story begin?","before sunrise",["midday","evening","midnight"],"'Before dawn' in the first line.","Mai woke before dawn. The streets of Hoi An were silent except for the soft scrape of a broom somewhere in the dark. She tiptoed past her sleeping brother, slipped on her sandals and hurried to the river, where the first boats were gliding out like shadows. Today was the lantern festival, and her grandmother had promised she could paint the biggest lantern in the market. Her heart fluttered like a trapped bird."],["'Tiptoed' suggests Mai wanted to be…","quiet",["noisy","angry","slow"],"Tiptoeing avoids noise.","Mai woke before dawn. The streets of Hoi An were silent except for the soft scrape of a broom somewhere in the dark. She tiptoed past her sleeping brother, slipped on her sandals and hurried to the river, where the first boats were gliding out like shadows. Today was the lantern festival, and her grandmother had promised she could paint the biggest lantern in the market. Her heart fluttered like a trapped bird."],["'Her heart fluttered like a trapped bird' is a…","simile",["metaphor","alliteration","idiom"],"Uses 'like'.","Mai woke before dawn. The streets of Hoi An were silent except for the soft scrape of a broom somewhere in the dark. She tiptoed past her sleeping brother, slipped on her sandals and hurried to the river, where the first boats were gliding out like shadows. Today was the lantern festival, and her grandmother had promised she could paint the biggest lantern in the market. Her heart fluttered like a trapped bird."],["Why is Mai excited?","She may paint the biggest lantern",["She is going shopping","It is her birthday","She is meeting her brother"],"Stated near the end.","Mai woke before dawn. The streets of Hoi An were silent except for the soft scrape of a broom somewhere in the dark. She tiptoed past her sleeping brother, slipped on her sandals and hurried to the river, where the first boats were gliding out like shadows. Today was the lantern festival, and her grandmother had promised she could paint the biggest lantern in the market. Her heart fluttered like a trapped bird."],["What is the text mainly about?","why bees matter",["how to make honey","a trip to a farm","a bee sting"],"The main idea.","Bees are vital to our food supply. When a bee visits a flower to collect nectar, grains of pollen stick to its body. As it moves to the next flower, some pollen rubs off, allowing the plant to make seeds and fruit. Scientists estimate that bees help pollinate around one third of the crops we eat. However, bee numbers are falling because of pesticides and the loss of wild flowers. Planting flower-rich gardens is one simple way we can help."],["'Pollinate' most likely means…","move pollen so plants can make seeds",["collect honey","sting insects","dig soil"],"Context: pollen moves between flowers.","Bees are vital to our food supply. When a bee visits a flower to collect nectar, grains of pollen stick to its body. As it moves to the next flower, some pollen rubs off, allowing the plant to make seeds and fruit. Scientists estimate that bees help pollinate around one third of the crops we eat. However, bee numbers are falling because of pesticides and the loss of wild flowers. Planting flower-rich gardens is one simple way we can help."],["What two things are causing bee numbers to fall?","pesticides and loss of wild flowers",["cold weather and disease","farms and honey","gardens and rain"],"Stated in the text.","Bees are vital to our food supply. When a bee visits a flower to collect nectar, grains of pollen stick to its body. As it moves to the next flower, some pollen rubs off, allowing the plant to make seeds and fruit. Scientists estimate that bees help pollinate around one third of the crops we eat. However, bee numbers are falling because of pesticides and the loss of wild flowers. Planting flower-rich gardens is one simple way we can help."],["'Vital' is closest in meaning to…","essential",["unusual","colourful","tiny"],"Very important.","Bees are vital to our food supply. When a bee visits a flower to collect nectar, grains of pollen stick to its body. As it moves to the next flower, some pollen rubs off, allowing the plant to make seeds and fruit. Scientists estimate that bees help pollinate around one third of the crops we eat. However, bee numbers are falling because of pesticides and the loss of wild flowers. Planting flower-rich gardens is one simple way we can help."],["The bee text is…","non-fiction",["fiction","a poem","a play"],"It gives facts and advice.","Bees are vital to our food supply. When a bee visits a flower to collect nectar, grains of pollen stick to its body. As it moves to the next flower, some pollen rubs off, allowing the plant to make seeds and fruit. Scientists estimate that bees help pollinate around one third of the crops we eat. However, bee numbers are falling because of pesticides and the loss of wild flowers. Planting flower-rich gardens is one simple way we can help."]],

{id:"summary-writing",n:"Summary Writing",k:R,notes:`<h3>What is a summary?</h3><p>A short version that keeps only the <b>main points</b>, in your <b>own words</b>.</p><h3>Steps</h3><ol><li>Read the text twice.</li><li>Underline the key idea in each paragraph.</li><li>Cross out examples, repetition and detail.</li><li>Write the points in order, using connectives (<i>firstly, however, as a result</i>).</li><li>Check the word limit.</li></ol><div class="warn">Don't copy whole sentences. Don't add your own opinion.</div>`,

{id:"persuasive-writing",n:"Persuasive Writing",k:W,notes:`<h3>Aim</h3><p>Convince the reader to agree or act. Use <b>AFOREST</b>: Alliteration, Facts, Opinions, Rhetorical questions, Emotive language, Statistics, Triples.</p><h3>Structure</h3><ol><li>Hook the reader</li><li>Clear point of view</li><li>2–3 paragraphs, each with a point + evidence</li><li>Answer a counter-argument</li><li>Strong call to action</li></ol><div class="ex">Do we really want our parks buried under litter? Every day, <mark>over 200 bags</mark> are dumped. Act now!</div>`,
 q:[["Which is a rhetorical question?","Who wouldn't want cleaner streets?",["What time is it?","Where is Ana?","How old are you?"],"No answer is expected."],["'Three reasons: it's quick, cheap and fun.' uses…","a triple",["a simile","onomatopoeia","a fragment"],"Lists of three persuade."],["Which is emotive language?","Innocent animals are suffering.",["The bin is full.","It's on Main St.","There are 5 bins."],"Stirs feelings."],["A call to action…","asks the reader to do something",["opens the text","is a statistic","is a simile"],"Sign the petition today!"],["Best ending for persuasive writing:","a strong final appeal",["a random fact","an apology","a new topic"],"Leave a lasting impression."],["Which is a statistic?","9 out of 10 students walk to school.",["Walking is fun.","Schools are big.","I like walking."],"A number as evidence."],["Which is an opinion?","School uniform is boring.",["School starts at 8.","There are 30 pupils.","Uniforms are grey."],"Cannot be proven."],["Good opening hook:","Imagine a world without clean water.",["My name is Sam.","I will talk now.","Hello."],"Grabs attention."],["A counter-argument is…","an opposing view that you answer",["your conclusion","a statistic","a greeting"],"Shows you've considered both sides."],["'Don't you think we deserve better?' is…","a rhetorical question",["a fact","a command","a simile"],"Invites the reader to agree."],["Persuasive writing should…","match tone to the audience",["use slang everywhere","avoid evidence","be as short as possible"],"Know your reader."]],
 w:["Write a persuasive paragraph (80–120 words) arguing that school should start later.","Write an advert persuading people to adopt a pet. Use a triple, a rhetorical question and a call to action."],
 c:["I used a rhetorical question","I used a statistic or fact","I used emotive language","I included a triple","I ended with a call to action"],
 m:`Should school start later? Imagine dragging yourself out of bed in the dark, eyes half shut, before the sun has even risen. Research shows that teenagers need 9 hours of sleep, yet most get far fewer. Tired students make mistakes, lose focus and feel miserable. Surely a later start would make us healthier, happier and smarter? Some argue that parents' work hours would clash, but flexible clubs could solve that. Let's act now: sign the petition and give every student a fair chance to wake up!`},

{id:"narrative-writing",n:"Narrative Writing",k:W,notes:`<h3>Story structure</h3><p>Opening (setting + character) → build-up → problem/climax → resolution → ending.</p><h3>Make it vivid</h3><ul><li><b>Show, don't tell</b>: <i>Her hands trembled</i> instead of <i>She was scared</i>.</li><li>Use the five senses; choose strong verbs (stormed, crept).</li><li>Vary sentence length – short sentences build tension.</li><li>New paragraph for a new speaker, time or place.</li><li>Keep one viewpoint and one tense.</li></ul>`,

{id:"journal",n:"Journal",k:W,notes:`<h3>What is a journal?</h3><p>A personal record of events, thoughts and feelings, often over time. It can also be a travel journal or a learning log.</p><ul><li>Write in the <b>first person</b> (I, my).</li><li>Include the <b>date</b> (and place).</li><li>Mix <b>what happened</b> with <b>how you felt</b> and what you learned.</li><li>Use mostly <b>past tense</b>; informal tone is fine.</li><li>Reflect at the end: <i>Next time I will…</i></li></ul>`,

function dailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function seeded(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function dailyPool(){const r=seeded(dailySeed()),a=ALLQ.filter(q=>!q.ctx).slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,5)}

  if(sub==="mock"){
    view.innerHTML=`${crumb}<h1>⏱️ Mock test</h1><div class="panel"><p>25 mixed questions in 25 minutes. When finished you'll see a score per topic and a review of every mistake. Stay focused – no peeking at the notes!</p><button class="btn pri" id="go">Start the mock test</button><div id="qa"></div></div>`;
    $("#go").onclick=()=>{$("#go").style.display="none";runQuiz($("#qa"),pickQ(ALLQ,25),{kind:"mock",limit:1500,showTopic:true,breakdown:true})};return}

    if(pool.length)$("#go").onclick=()=>{$("#go").style.display="none";runQuiz($("#qa"),shuffle(pool).slice(0,20),{kind:"mistakes",showTopic:true})};return}
  if(sub==="flash"){flashcards(crumb);return}
  if(sub==="glossary"){
    view.innerHTML=`${crumb}<h1>📚 Glossary</h1><p><input type="search" id="gq" class="fld" placeholder="Search terms…" style="width:100%;max-width:340px"> <button class="btn" onclick="print()">🖨 Print</button></p><dl class="gl panel" id="gl"></dl>`;
    const d=()=>{const q=$("#gq").value.toLowerCase();$("#gl").innerHTML=GL.filter(g=>(g[0]+g[1]).toLowerCase().includes(q)).map(g=>`<dt>${esc(g[0])}</dt><dd>${esc(g[1])}${g[2]?` <i>— e.g. ${esc(g[2])}</i>`:""}</dd>`).join("")||"<p>No match.</p>"};$("#gq").oninput=d;d();return}

function flashcards(crumb){
  let deck=[],i=0,onlyNew=false;
  const build=()=>{deck=shuffle(GL.map((g,k)=>({t:g[0],d:g[1],e:g[2],k})).filter(c=>!onlyNew||!S.known.includes(c.k)));i=0;draw()};
  const draw=()=>{
    view.innerHTML=`${crumb}<h1>🃏 Flashcards</h1><p class="sub">Tap the card to flip. ${S.known.length}/${GL.length} marked as known. <label><input type="checkbox" id="on" ${onlyNew?"checked":""}> only show cards I haven't learned</label></p>
    ${deck.length?`<div class="fc" id="fc"><div><div class="f">${esc(deck[i].t)}</div><div class="b"><div>${esc(deck[i].d)}</div>${deck[i].e?`<i>e.g. ${esc(deck[i].e)}</i>`:""}</div></div></div><p style="text-align:center;color:var(--mute)">Card ${i+1} of ${deck.length}</p><p style="text-align:center"><button class="btn" id="ag">↺ Again later</button> <button class="btn pri" id="gt">✓ I know it</button></p>`:`<div class="panel"><p>🎉 You've learned every card! Untick the filter to revise them all.</p></div>`}`;
    $("#on").onchange=e=>{onlyNew=e.target.checked;build()};
    if(deck.length){$("#fc").onclick=()=>$("#fc").classList.toggle("flip");
      const nx=()=>{i++;if(i>=deck.length){toast("Deck finished!");build()}else draw()};
      $("#gt").onclick=()=>{const k=deck[i].k;if(!S.known.includes(k))S.known.push(k);persist();bump();nx()};
      $("#ag").onclick=()=>{S.known=S.known.filter(x=>x!==deck[i].k);persist();nx()}}
  };build();
}

const attLabel=a=>a.kind==="topic"?(topicById[a.topic_id]?.n||a.topic_id):a.kind==="checkpoint"?"Checkpoint: "+(PATHS.find(p=>p.id===a.topic_id)?.n||""):KIND[a.kind]||a.kind;
const pcCls=v=>v==null?"hc0":v>=80?"hc3":v>=60?"hc2":"hc1";
const parseNames=txt=>{const seen=new Set(),out=[];String(txt||"").split(/[\n,;]+/).map(s=>s.trim().replace(/\s+/g," ")).filter(Boolean).forEach(n=>{n=n.slice(0,80);const k=n.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(n)}});return out.slice(0,200)};
const errMsg=e=>e?.message||String(e);
const genPin=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%10000).padStart(4,"0");
const isLocked=s=>s.pin_locked_until&&new Date(s.pin_locked_until)>new Date();

async function loadTD(id){
  const [c,st,ss,at,as]=await Promise.all([
    sb.from("classes").select("*").eq("id",id).single(),
    sb.from("students").select("*").eq("class_id",id).order("name"),
    sb.from("student_state").select("student_id,state,updated_at").eq("class_id",id),
    sb.from("attempts").select("*").eq("class_id",id).order("created_at",{ascending:false}).limit(1500),
    sb.from("assignments").select("*").eq("class_id",id).order("created_at",{ascending:false})]);
  const err=[c,st,ss,at,as].find(r=>r.error);if(err)throw err.error;
  const states={},upd={};(ss.data||[]).forEach(r=>{states[r.student_id]=r.state||{};upd[r.student_id]=r.updated_at});
  TD={cls:c.data,students:st.data||[],states,upd,attempts:at.data||[],assigns:as.data||[]};
  computeM();
}
function computeM(){
  TD.m={};
  TD.students.forEach(s=>{
    const st=TD.states[s.id]||{},p=st.prog||{};
    const arr=T.map(t=>p[t.id]).filter(Boolean);
    const att=TD.attempts.filter(a=>a.student_id===s.id);
    TD.m[s.id]={st,p,mastered:T.filter(t=>(p[t.id]?.best||0)>=80).length,started:arr.length,avg:arr.length?Math.round(arr.reduce((a,v)=>a+v.best,0)/arr.length):null,att,last:att[0]?.created_at||TD.upd[s.id]||null,streak:(()=>{const d=st.streak?.day;return d&&(d===new Date().toDateString()||d===new Date(Date.now()-864e5).toDateString())?st.streak.n:0})(),mist:(st.mistakes||[]).length};
  });
}

}

function tdOverview(el){
  const ss=TD.students,M=TD.m,n=ss.length;
  if(!n){el.innerHTML=`<div class="info">No students yet. Go to <b>Roster &amp; settings</b> to add names, then share the class code <b>${esc(TD.cls.code)}</b>.</div>`;return}
  const active7=ss.filter(s=>M[s.id].last&&Date.now()-new Date(M[s.id].last)<7*864e5).length;
  const avgs=ss.map(s=>M[s.id].avg).filter(v=>v!=null),avgScore=avgs.length?Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length)+"%":"–";
  const avgMast=Math.round(ss.reduce((a,s)=>a+M[s.id].mastered,0)/n*10)/10;
  const attention=ss.filter(s=>{const m=M[s.id];return !m.last||Date.now()-new Date(m.last)>7*864e5||(m.avg!=null&&m.avg<60)});
  const tstats=T.map(t=>{const v=ss.map(s=>M[s.id].p[t.id]?.best).filter(x=>x!=null);return{t,n:v.length,avg:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}}).filter(x=>x.n>0).sort((a,b)=>a.avg-b.avg).slice(0,5);
  const cnt={};TD.attempts.forEach(a=>(a.wrong||[]).forEach(id=>cnt[id]=(cnt[id]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id,c])=>({q:QBY[id],c})).filter(x=>x.q);
  const nameOf=id=>TD.students.find(s=>s.id===id)?.name||"?";
  el.innerHTML=`<section class="stats"><div class="stat"><b>${n}</b><small>students</small></div><div class="stat"><b>${active7}/${n}</b><small>active in the last 7 days</small></div><div class="stat"><b>${avgScore}</b><small>average best score</small></div><div class="stat"><b>${avgMast}/${T.length}</b><small>avg topics mastered</small></div><div class="stat"><b>${TD.attempts.length}</b><small>quizzes completed</small></div></section>
  <div class="two">
   <div class="panel"><h3 style="margin-top:0">⚠ Needs attention</h3>${attention.length?`<ul class="clean">${attention.map(s=>{const m=M[s.id];return `<li><a href="#" data-s="${s.id}">${esc(s.name)}</a> <small>${!m.last?"hasn't started":Date.now()-new Date(m.last)>7*864e5?"inactive – "+ago(m.last):"avg "+m.avg+"%"}</small></li>`}).join("")}</ul>`:"<p>🎉 Everyone is active and on track.</p>"}</div>
   <div class="panel"><h3 style="margin-top:0">📉 Hardest topics (lowest class average)</h3>${tstats.length?`<ul class="clean">${tstats.map(x=>`<li>${esc(x.t.n)} <span class="badge ${pcCls(x.avg)}">${x.avg}%</span> <small>${x.n} student${x.n>1?"s":""}</small></li>`).join("")}</ul>`:"<p>No quiz data yet.</p>"}</div>
  </div>
  <div class="two">
   <div class="panel"><h3 style="margin-top:0">❓ Most-missed questions</h3>${top.length?`<ol class="clean">${top.map(x=>`<li>${esc(x.q.q)} <small>— ${esc(topicById[x.q.t].n)} · missed ${x.c}×<br>Answer: ${esc(x.q.a)}</small></li>`).join("")}</ol>`:"<p>Nothing yet.</p>"}</div>
   <div class="panel"><h3 style="margin-top:0">🕒 Recent activity</h3>${TD.attempts.length?`<ul class="clean">${TD.attempts.slice(0,10).map(a=>`<li><b>${esc(nameOf(a.student_id))}</b> · ${esc(attLabel(a))} <span class="badge ${pcCls(a.pct)}">${a.score}/${a.total}</span> <small>${ago(a.created_at)}</small></li>`).join("")}</ul>`:"<p>No activity yet.</p>"}</div>
  </div>`;
  el.querySelectorAll("[data-s]").forEach(a=>a.onclick=e=>{e.preventDefault();tdSel=a.dataset.s;tdTab="students";drawTD()});
}
function tdStudents(el){
  const rows=TD.students.map(s=>({s,m:TD.m[s.id]}));
  const key={name:r=>r.s.name.toLowerCase(),mastered:r=>r.m.mastered,avg:r=>r.m.avg??-1,att:r=>r.m.att.length,last:r=>r.m.last?+new Date(r.m.last):0,streak:r=>r.m.streak,mist:r=>r.m.mist}[tdSort.k];
  rows.sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*tdSort.d});
  const th=(k,l)=>`<th class="srt" data-k="${k}">${l}${tdSort.k===k?(tdSort.d>0?" ▲":" ▼"):""}</th>`;
  el.innerHTML=`<p><button class="btn sm" id="csv">⬇ Export CSV</button></p><div class="scroll"><table class="dt"><tr>${th("name","Student")}${th("mastered","Mastered")}${th("avg","Avg best")}${th("att","Quizzes")}${th("last","Last active")}${th("streak","Streak")}${th("mist","Mistakes")}</tr>
  ${rows.map(({s,m})=>`<tr><td><a href="#" data-s="${s.id}">${esc(s.name)}</a></td><td>${m.mastered}/${T.length}<div class="bar"><div style="width:${m.mastered/T.length*100}%"></div></div></td><td>${m.avg==null?"–":`<span class="badge ${pcCls(m.avg)}">${m.avg}%</span>`}</td><td>${m.att.length}</td><td>${ago(m.last)}</td><td>${m.streak?m.streak+" 🔥":"–"}</td><td>${m.mist}</td></tr>`).join("")||`<tr><td colspan="7">No students yet.</td></tr>`}</table></div>`;
  el.querySelectorAll(".srt").forEach(h=>h.onclick=()=>{tdSort=tdSort.k===h.dataset.k?{k:tdSort.k,d:-tdSort.d}:{k:h.dataset.k,d:h.dataset.k==="name"?1:-1};tdStudents(el)});
  el.querySelectorAll("[data-s]").forEach(a=>a.onclick=e=>{e.preventDefault();tdSel=a.dataset.s;drawTD()});
  $("#csv").onclick=()=>{
    const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const head=["Student","Topics mastered","Avg best %","Quizzes","Last active","Streak","Mistakes",...T.map(t=>t.n)];
    const lines=[head.map(q).join(",")];
    TD.students.forEach(s=>{const m=TD.m[s.id];lines.push([s.name,m.mastered,m.avg??"",m.att.length,m.last||"",m.streak,m.mist,...T.map(t=>m.p[t.id]?.best??"")].map(q).join(","))});
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv"}));a.download=TD.cls.name.replace(/[^\w]+/g,"_")+"_progress.csv";a.click();URL.revokeObjectURL(a.href);
  };

  <h3>Struggling with</h3>${Object.keys(mq).length?`<p>${Object.entries(mq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t,c])=>`${esc(topicById[t].n)} (${c})`).join(", ")}</p>`:"<p>No open mistakes 🎉</p>"}
  ${dr.length?`<h3>Writing drafts</h3>${dr.map(k=>`<details><summary>${esc(topicById[k]?.n||k)}</summary><p style="white-space:pre-wrap">${esc(m.st.drafts[k])}</p></details>`).join("")}`:""}</div></div>`;
  $("#bk").onclick=e=>{e.preventDefault();tdSel=null;drawTD()};
  $("#np").onclick=async()=>{if(!confirm(`Give ${s.name} a new PIN? Their old PIN stops working.`))return;if(await newPin(s))drawTD()};
  if($("#ul"))$("#ul").onclick=async()=>{await unlock(s);drawTD()};
  $("#rn").onclick=async()=>{const n=(prompt("New name:",s.name)||"").trim();if(!n||n===s.name)return;const {error}=await sb.from("students").update({name:n.slice(0,80)}).eq("id",s.id);if(error)return toast(error.message);s.name=n.slice(0,80);drawTD()};
  $("#rs").onclick=async()=>{if(!confirm(`Delete ALL progress and quiz history for ${s.name}?`))return;const a=await sb.from("student_state").delete().eq("student_id",s.id),b=await sb.from("attempts").delete().eq("student_id",s.id);if(a.error||b.error)return toast((a.error||b.error).message);toast("Progress reset");teacherClass(TD.cls.id,true)};
  $("#rm").onclick=async()=>{if(!confirm(`Remove ${s.name} from the class? Their data will be deleted.`))return;const {error}=await sb.from("students").delete().eq("id",s.id);if(error)return toast(error.message);tdSel=null;teacherClass(TD.cls.id,true)};
}
function tdHeat(el){
  if(!TD.students.length){el.innerHTML=`<div class="info">No students yet.</div>`;return}
  el.innerHTML=`<p class="sub">Best score per student and topic. <span class="badge hc3">80%+</span> <span class="badge hc2">60–79%</span> <span class="badge hc1">&lt;60%</span> <span class="badge hc0">not started</span></p>
  <div class="scroll"><table class="heat"><tr><th class="stk">Student</th>${T.map(t=>`<th class="rot"><span>${esc(t.n)}</span></th>`).join("")}</tr>
  ${TD.students.map(s=>{const m=TD.m[s.id];return `<tr><td class="stk">${esc(s.name)}</td>${T.map(t=>{const v=m.p[t.id]?.best;const r=v==null?null:Math.round(v);return `<td class="hc ${pcCls(r)}" title="${esc(s.name)} – ${esc(t.n)}: ${r==null?"not started":r+"%"}">${r??""}</td>`}).join("")}</tr>`}).join("")}
  <tr><td class="stk"><b>Class avg</b></td>${T.map(t=>{const v=TD.students.map(s=>TD.m[s.id].p[t.id]?.best).filter(x=>x!=null);const a=v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null;return `<td class="hc ${pcCls(a)}"><b>${a??""}</b></td>`}).join("")}</tr></table></div>`;
}
function tdAssign(el){
  const today=new Date().toISOString().slice(0,10);
  const targets=k=>k==="topic"?T.map(t=>[t.id,t.n]):PATHS.filter(p=>!p.type).map(p=>[p.id,p.n]);
  el.innerHTML=`<form id="af" class="panel col"><h3 style="margin:0">Set new work</h3><div class="two"><label>Type<select class="fld" id="ak"><option value="topic">Topic quiz</option><option value="path">Pathway checkpoint</option></select></label><label>Target<select class="fld" id="at"></select></label></div>
  <div class="two"><label>Pass mark %<input class="fld" id="am" type="number" min="1" max="100" value="80"></label><label>Due date <small>(optional)</small><input class="fld" id="ad" type="date" min="${today}"></label></div>
  <label>Title<input class="fld" id="atl" maxlength="120" required></label><label>Note for students <small>(optional)</small><input class="fld" id="an" maxlength="300" placeholder="e.g. Read the notes first!"></label><button class="btn pri">Assign to class</button><div id="amsg" class="msg"></div></form>
  <h3>Current assignments</h3>${TD.assigns.length?TD.assigns.map(a=>{const done=TD.students.filter(s=>asgDone(a,TD.m[s.id].st)),pend=TD.students.filter(s=>!asgDone(a,TD.m[s.id].st));const pc=TD.students.length?Math.round(done.length/TD.students.length*100):0;
   return `<div class="panel" style="margin-bottom:12px"><div class="dhead"><div><b>${esc(a.title)}</b><br><small>${esc(asgTargetName(a))} · pass ${a.min_pct}% · ${a.due_date?"due "+fmtDate(a.due_date):"no due date"}</small></div><button class="btn sm" data-del="${a.id}">Delete</button></div><div class="bar"><div style="width:${pc}%"></div></div><p style="margin:6px 0"><b>${done.length}/${TD.students.length}</b> complete</p>${pend.length?`<details><summary>Not yet done (${pend.length})</summary><p>${pend.map(s=>esc(s.name)).join(", ")}</p></details>`:"<p>🎉 Everyone's done!</p>"}</div>`}).join(""):"<p>No assignments yet.</p>"}`;
  const fill=()=>{const k=$("#ak").value;$("#at").innerHTML=targets(k).map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("");title()};
  const title=()=>{$("#atl").value=($("#ak").value==="topic"?"Complete the ":"Pass the ")+$("#at").selectedOptions[0].text+($("#ak").value==="topic"?" quiz":" checkpoint")};
  $("#ak").onchange=fill;$("#at").onchange=title;fill();
  $("#af").onsubmit=async e=>{e.preventDefault();const {error}=await sb.from("assignments").insert({class_id:TD.cls.id,kind:$("#ak").value,target:$("#at").value,min_pct:Math.max(1,Math.min(100,+$("#am").value||80)),title:$("#atl").value.trim(),note:$("#an").value.trim()||null,due_date:$("#ad").value||null});if(error){$("#amsg").innerHTML=`<span class="late">${esc(error.message)}</span>`;return}toast("Assigned!");teacherClass(TD.cls.id,true)};
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this assignment?"))return;const {error}=await sb.from("assignments").delete().eq("id",b.dataset.del);if(error)return toast(error.message);teacherClass(TD.cls.id,true)});
}
function tdRoster(el){
  const c=TD.cls;
  el.innerHTML=`<div class="two"><div class="panel"><h3 style="margin-top:0">Students (${TD.students.length})</h3>${TD.students.length?`<p class="notice">🔑 Each student has a <b>4-digit PIN</b>. Hand them out with <b>Print login slips</b>.</p><p><button class="btn sm" id="slips">🖨 Print login slips</button> <button class="btn sm" id="pincsv">⬇ PIN list (CSV)</button></p><ul class="clean">${TD.students.map(s=>`<li>${esc(s.name)} <code class="pinchip">${esc(s.pin)}</code>${isLocked(s)?` 🔒 <a href="#" data-u="${s.id}">unlock</a>`:""} <small><a href="#" data-p="${s.id}">new PIN</a> · <a href="#" data-r="${s.id}">rename</a> · <a href="#" data-x="${s.id}">remove</a></small></li>`).join("")}</ul>`:"<p>No students yet.</p>"}
  <form id="rf" class="col" style="margin-top:12px"><label>Add students <small>(one per line)</small><textarea class="fld" id="rn" style="min-height:100px" placeholder="Name one&#10;Name two"></textarea></label><button class="btn pri">Add to class</button><div id="rmsg" class="msg"></div></form></div>
  <div class="panel"><h3 style="margin-top:0">Class details</h3><form id="df" class="col"><label>Class name<input class="fld" id="dn" required maxlength="80" value="${esc(c.name)}"></label><label>Year group<input class="fld" id="dy" maxlength="40" value="${esc(c.year_group||"")}"></label><label>School<input class="fld" id="ds" maxlength="120" value="${esc(c.school||"")}"></label><label>Notes<input class="fld" id="dd" maxlength="500" value="${esc(c.description||"")}"></label><button class="btn pri">Save details</button></form>
  <h3>Class code</h3><p><b class="bigcode">${esc(c.code)}</b></p><p><small>Students open the site → “I'm in a class” → enter this code → pick their name → type their PIN.</small></p><button class="btn sm" id="regen">Generate a new code</button>
  <h3>Danger zone</h3><button class="btn sm dangerb" id="delc">Delete this class</button></div></div>`;
  if($("#slips")){$("#slips").onclick=printSlips;$("#pincsv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[["Student","Class code","PIN"].map(q).join(","),...TD.students.map(s=>[s.name,c.code,s.pin].map(q).join(","))].join("\n")],{type:"text/csv"}));a.download=c.name.replace(/[^\w]+/g,"_")+"_pins.csv";a.click();URL.revokeObjectURL(a.href)}}
  el.querySelectorAll("[data-p]").forEach(a=>a.onclick=async e=>{e.preventDefault();const s=TD.students.find(x=>x.id===a.dataset.p);if(!confirm(`Give ${s.name} a new PIN? Their old PIN stops working.`))return;if(await newPin(s))tdRoster(el)});
  el.querySelectorAll("[data-u]").forEach(a=>a.onclick=async e=>{e.preventDefault();const s=TD.students.find(x=>x.id===a.dataset.u);await unlock(s);tdRoster(el)});
  $("#rf").onsubmit=async e=>{e.preventDefault();const have=new Set(TD.students.map(s=>s.name.toLowerCase()));const names=parseNames($("#rn").value).filter(n=>!have.has(n.toLowerCase()));if(!names.length){$("#rmsg").textContent="No new names to add.";return}const {error}=await sb.from("students").insert(names.map(name=>({class_id:c.id,name})));if(error){$("#rmsg").innerHTML=`<span class="late">${esc(error.message)}</span>`;return}toast(names.length+" added");teacherClass(c.id,true)};
  el.querySelectorAll("[data-r]").forEach(a=>a.onclick=async e=>{e.preventDefault();const s=TD.students.find(x=>x.id===a.dataset.r);const n=(prompt("New name:",s.name)||"").trim();if(!n||n===s.name)return;const {error}=await sb.from("students").update({name:n.slice(0,80)}).eq("id",s.id);if(error)return toast(error.message);teacherClass(c.id,true)});
  el.querySelectorAll("[data-x]").forEach(a=>a.onclick=async e=>{e.preventDefault();const s=TD.students.find(x=>x.id===a.dataset.x);if(!confirm(`Remove ${s.name}? Their data will be deleted.`))return;const {error}=await sb.from("students").delete().eq("id",s.id);if(error)return toast(error.message);teacherClass(c.id,true)});
  $("#df").onsubmit=async e=>{e.preventDefault();const {error}=await sb.from("classes").update({name:$("#dn").value.trim(),year_group:$("#dy").value.trim()||null,school:$("#ds").value.trim()||null,description:$("#dd").value.trim()||null}).eq("id",c.id);if(error)return toast(error.message);toast("Saved");teacherClass(c.id,true)};
  $("#regen").onclick=async()=>{if(!confirm("Students will need the new code to join. Students already signed in stay signed in only until they next load the page. Continue?"))return;const {error}=await sb.rpc("regenerate_class_code",{p_class:c.id});if(error)return toast(error.message);teacherClass(c.id,true)};
  $("#delc").onclick=async()=>{const t=prompt(`This permanently deletes the class and ALL student data.\nType the class name (${c.name}) to confirm:`);if(t!==c.name)return;const {error}=await sb.from("classes").delete().eq("id",c.id);if(error)return toast(error.message);location.hash="#/teacher"};
}

/* ================= ROUTER ================= */
function route(){
  clearInterval(timerId);
  renderNav();
  const h=location.hash||"#/";let m;
  if(h.startsWith("#/teacher")){renderTeacher(h.slice(9));return}
  if(h==="#/welcome"){renderWelcome();return}
  if(!session){location.hash="#/welcome";return}
  if(bootError){renderBootError();return}
  if(h==="#/"||h===""){show("home");renderHome()}
  else if(h==="#/topics"){show("home");renderHome();setTimeout(()=>document.getElementById("topicsSection")?.scrollIntoView(),0)}
  else if(m=h.match(/^#\/topic\/([\w-]+)/)){topicById[m[1]]?renderTopic(m[1]):(location.hash="#/")}
  else if(h==="#/pathways")renderPaths();
  else if(m=h.match(/^#\/path\/([\w-]+)/))renderPath(m[1]);
  else if(m=h.match(/^#\/revise\/?([\w-]*)/))renderRevise(m[1]);
  else{location.hash="#/"}
}
addEventListener("hashchange",route);

async function boot(){
  if(session?.mode==="guest")S=Object.assign(blank(),ls.get(GUEST_KEY)||{});
  else if(session?.mode==="class"){
    if(!sb){bootError="Couldn't reach the class server. Check your internet connection."}
    else{
      renderNav();show("view");view.innerHTML="<p>Loading your class…</p>";
      try{await loadClassSession()}catch(e){if(e.auth){ls.del(SESSION_KEY);session=null;toast(e.message)}else bootError=errMsg(e)}
    }
  }
  if(sb){
    try{
      const {data}=await sb.auth.getSession();teacher=data?.session?.user||null;
      if((new URLSearchParams(location.search).get("code")||"").length>10)history.replaceState(null,"",location.pathname+location.hash);
      sb.auth.onAuthStateChange((ev,s)=>{teacher=s?.user||null;if(ev==="PASSWORD_RECOVERY"){recovery=true;location.hash="#/teacher"}setTimeout(()=>{renderNav();if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="PASSWORD_RECOVERY"){if(location.hash.startsWith("#/teacher"))route()}},0)});
    }catch(e){console.warn(e)}
  }
  route();
}
boot();

</script>
